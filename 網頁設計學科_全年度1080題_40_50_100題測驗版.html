let quiz=[],answers=[],index=0;
const years=[...new Set(BANK.map(q=>q.year))].sort((a,b)=>b-a);
$('year').innerHTML='<option value="all">全部年度</option>'+years.map(y=>`<option value="${y}">${y} 學年度</option>`).join('');
function pool(){return BANK.filter(q=>$('year').value==='all'||q.year===Number($('year').value));}
function updateAvailable(){const n=pool().length;const selected=$('count');for(const o of selected.options){if(o.value!=='all')o.disabled=Number(o.value)>n;}if(selected.selectedOptions[0]?.disabled)selected.value='all';$('available').textContent=`此範圍共有 ${n} 題。題數超過可用題目時，該選項會停用；如需 50 或 100 題，請選擇「全部年度」。`;}
$('year').onchange=updateAvailable;updateAvailable();
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(list){quiz=list;answers=Array(quiz.length).fill(null);index=0;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('exam').classList.remove('hidden');render();}
$('start').onclick=()=>{let p=pool().slice();if($('order').value==='random')shuffle(p);else p.sort((a,b)=>a.year-b.year||a.num-b.num);let n=$('count').value==='all'?p.length:Number($('count').value);begin(p.slice(0,n));};
function render(){const q=quiz[index];if(!q)return;$('progress').textContent=`${q.year} 學年度｜${q.kind}｜第 ${q.num} 題　（${index+1}/${quiz.length}）`;$('answered').textContent=`已作答 ${answers.filter(x=>x!==null).length}/${quiz.length}`;$('question').textContent=q.q;const el=$('options');el.replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(answers[index]===i?' selected':'');b.setAttribute('aria-pressed',String(answers[index]===i));const prefix=document.createElement('span');prefix.textContent='ABCD'[i]+'.';const content=document.createElement('div');content.textContent=opt;b.append(prefix,content);b.onclick=()=>{answers[index]=i;render()};el.append(b)});$('prev').disabled=index===0;$('next').disabled=index===quiz.length-1;}
$('prev').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};
$('submit').onclick=()=>{let blank=answers.filter(a=>a===null).length;if(blank&&!confirm(`還有 ${blank} 題未作答，確定交卷？`))return;finish()};
function finish(){const correct=quiz.filter((q,i)=>answers[i]===q.answer).length;$('exam').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${Math.round(correct/quiz.length*100)} 分`;$('summary').textContent=`答對 ${correct} 題／共 ${quiz.length} 題；未作答 ${answers.filter(x=>x===null).length} 題。`;const r=$('reviews');r.replaceChildren();quiz.forEach((q,i)=>{const section=document.createElement('div');section.className='review';const heading=document.createElement('strong');heading.textContent=`${i+1}. ${q.year} 年第 ${q.num} 題｜${answers[i]===q.answer?'答對':'答錯或未答'}`;section.append(heading);const stem=document.createElement('p');stem.textContent=q.q;section.append(stem);q.options.forEach((o,j)=>{const p=document.createElement('p');p.textContent=`${'ABCD'[j]}. ${o}`;if(j===q.answer)p.className='option correct';else if(j===answers[i])p.className='option wrong';section.append(p)});const note=document.createElement('p');note.textContent=`你的答案：${answers[i]===null?'未作答':'ABCD'[answers[i]]}｜正確答案：${'ABCD'[q.answer]}`;section.append(note);r.append(section)});window.scrollTo(0,0);}
$('restart').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');window.scrollTo(0,0)};
$('retry').onclick=()=>{const wrong=quiz.filter((q,i)=>answers[i]!==q.answer);if(!wrong.length){alert('全部答對，沒有錯題！');return;}begin(wrong);window.scrollTo(0,0)};
</script></body></html>
